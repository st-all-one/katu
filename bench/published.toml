# --- Latência do provider (E12-T07 / F4-E18-T04) ---
# Protocolo em `bench/providers/PROTOCOL.md`; artefacto cru em `bench/providers/latency.json`.
# O overhead de cliente é offline (MockTransport, determinístico); o TTFT é live contra o
# `llama-server` local (CPU) — percentis variam por máquina, a razão de cache é `provider_reported`.

[[metrics]]
