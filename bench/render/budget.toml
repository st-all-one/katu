# Orçamento de render por quadro (E15-T01 / E10-T03).
#
# `xtask gate:render` re-mede 400 quadros num `TestBackend` de 120×40 com a conversa no teto
# (200 entradas) e **falha** se o p95 exceder este valor. Dado versionado, não constante de código.
# Referência local: p95 ≈ 0.74 ms; o orçamento tem folga para o CI (máquinas mais lentas).

[render]
frame_p95_nanos = 3000000

# Alocações por quadro (E18-T10). Medidas em `crates/katu/tests/render_alloc.rs` (allocator de
# contagem, `unsafe` registado em `EXCEPTIONS`): **1137 alocações / 153 785 B** por quadro no pior
# caso (120×40, conversa no teto de 200 entradas). A afirmação «o render não aloca» é **falsa**.
# O que se trava é que **não cresça**: o teste falha se ultrapassar estes valores.
[render_alloc]
# As **contagens** são quase estáveis (1136–1137 em execuções repetidas, ±1 pela kolecção de
# `TestBackend`); os **bytes** variam ~0,2 %. Por isso ambos os orçamentos têm folga: o que se
# trava é o **crescimento**, não o dígito exacto.
frame_allocations = 1200
frame_alloc_bytes = 175000
