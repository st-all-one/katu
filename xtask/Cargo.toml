[package]
name = "xtask"
description = "Tarefas de build e verificação do workspace katu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
katu-core.workspace = true
katu-policy.workspace = true
katu-tools.workspace = true
katu-providers.workspace = true
katu-tui.workspace = true
ratatui.workspace = true
tiktoken-rs = { version = "0.12", optional = true }

[features]
# Micro-bench de densidade (dev-only): `cargo run -p xtask --features tokenizer -- bench-toon`.
tokenizer = ["dep:tiktoken-rs"]

[lints]
workspace = true
