name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy -p katu-core --features instrument --all-targets -- -D warnings
      - run: cargo clippy -p katu --features profile --all-targets -- -D warnings
      - run: cargo test -p katu-core --features instrument
      - run: cargo test -p katu --features profile
