[workspace]
resolver = "2"
# `crates/knudge` é um workspace à parte (submódulo); não herda as deps daqui.
exclude = ["crates/knudge"]
members = [
    "crates/katu-core",
    "crates/katu-policy",
    "crates/katu-tools",
    "crates/katu-providers",
    "crates/katu-tui",
    "crates/katu",
    "xtask",
]
default-members = ["crates/katu"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# tipos/erros comuns
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI
clap = { version = "4", features = ["derive"] }
# TUI (E10)
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# dados versionados (E02/E14/tooling)
toml = "0.8"
# compressão do corpo do pedido do provider (opcional; nível rápido, latência primeiro)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# crates internos
katu-core = { path = "crates/katu-core" }
katu-policy = { path = "crates/katu-policy" }
katu-tools = { path = "crates/katu-tools" }
katu-providers = { path = "crates/katu-providers" }
katu-tui = { path = "crates/katu-tui" }
# dev
proptest = "1"

# =============================================================================
# Lints — rigor máximo (copiado do `knudge`, D92) · Rust 1.97 / Edition 2024.
# Os valores do Clippy ficam em `clippy.toml`; aqui ficam os NÍVEIS.
# =============================================================================
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "deny"
unused_lifetimes = "deny"
elided_lifetimes_in_paths = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
let_underscore_drop = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
non_ascii_idents = "deny"
noop_method_call = "deny"
unused_import_braces = "deny"
variant_size_differences = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# Grupos (prioridade menor para permitir overrides pontuais)
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Restriction curada (D92)
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "warn"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "warn"
absolute_paths = "warn"
wildcard_imports = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
disallowed_fields = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_names = "deny"
disallowed_types = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
allow_attributes_without_reason = "deny"

# Tamanho / perf
large_enum_variant = "deny"
result_large_err = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "deny"
large_stack_frames = "warn"
large_futures = "warn"

# Ruidosas: abrimos mão (documentado)
module_name_repetitions = "allow"
must_use_candidate = "allow"
implicit_hasher = "allow"
multiple_crate_versions = "allow"
min_ident_chars = "allow"
many_single_char_names = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
allow_attributes = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
excessive_nesting = "allow"

# Documentação
missing_safety_doc = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true
panic = "abort"

[profile.dev]
debug-assertions = true
overflow-checks = true
# Skill Rust §15: dependências otimizadas em dev/teste — o loop de teste fica muito mais rápido
# sem perder símbolos do nosso código. Não afeta `build.rs` (ver `build-override`).
[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.bench]
inherits = "release"
debug = 1
