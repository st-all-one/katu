# E02-T07 — as regras do protocolo de memória do knudge, expressas no vocabulário fechado.
#
# Cada regra é **dado** (DF3): âmbito + forma de aplicação + exemplos. Nenhum texto livre executa.
# As operações de memória são comandos nominais (`memory_recall`, `memory_write`, `memory_outcome`,
# `memory_close`); a verificação semântica (dedup ≥ 0.92, âncora, uma afirmação) é feita pelo
# adaptador (E03) e chega ao motor como **capacidade** (`Capability::Command`). Sem a capacidade, as
# regras `deny_command` disparam — falha fechada (DF4). Ver `plan/03` §E02-T07.

vocab = 1

# 1. Nada de escrever sem buscar: gravar exige um `memory_recall` concluído na mesma fase.
[[rules]]
id = "mem-recall-before-write"
statement = "Memória: não gravar nota sem ter consultado o conhecimento (recall) na mesma fase"
scope = { command = { tool = "memory_write" } }
enforcement = { require_after = { tool = "memory_recall" } }
severity = "critical"
category = "enforced"
examples = { negative = ["memory_write sem memory_recall prévio"], positive = ["memory_recall → memory_write"] }

# 2. Fecho por evidência: fechar tarefa exige um `memory_outcome` registado.
[[rules]]
id = "mem-outcome-before-close"
statement = "Memória: fechar tarefa exige `outcome` registado"
scope = { command = { tool = "memory_close" } }
enforcement = { require_after = { tool = "memory_outcome" } }
severity = "critical"
category = "enforced"
examples = { negative = ["memory_close sem memory_outcome"], positive = ["memory_outcome → memory_close"] }

# 3. Sem duplicata forte (≥ 0.92): `deny_command` falha fechado; a capacidade só é concedida se o
#    `pre_write` não acusar duplicata.
[[rules]]
id = "mem-no-duplicate"
statement = "Memória: não gravar nota que seja duplicata forte (≥ 0.92) de nota existente"
scope = { command = { tool = "memory_write" } }
enforcement = { deny_command = { tool = "memory_write" } }
severity = "critical"
category = "enforced"
examples = { negative = ["memory_write de duplicata a 0.95"], positive = ["memory_write de nota nova"] }

# 4. Âncora obrigatória: nota sobre código exige `--anchor` (validado pelo adaptador).
[[rules]]
id = "mem-anchor-required"
statement = "Memória: nota sobre código exige `--anchor`"
scope = { command = { tool = "memory_write" } }
enforcement = { deny_command = { tool = "memory_write" } }
severity = "critical"
category = "enforced"
examples = { negative = ["memory_write sobre src/x.rs sem âncora"], positive = ["memory_write com --anchor src/x.rs"] }

# 5. Uma afirmação por nota.
[[rules]]
id = "mem-single-claim"
statement = "Memória: uma afirmação por nota"
scope = { command = { tool = "memory_write" } }
enforcement = { deny_command = { tool = "memory_write" } }
severity = "critical"
category = "enforced"
examples = { negative = ["memory_write com duas afirmações"], positive = ["memory_write com uma afirmação"] }
