[package]
name = "katu"
description = "katu — CLI: loop possuído, política e memória (binário)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "katu"
path = "src/main.rs"

[[example]]
name = "measure_mvk"
path = "examples/measure_mvk.rs"
required-features = ["profile"]

[features]
default = ["memory-in-process"]
# Instrumentação transversal (DF9/E19): compila o caminho ativo e o sink de `stderr`.
profile = ["katu-core/instrument"]
# Adaptador in-process do knudge (E03-T02): a memória de primeira classe (G4).
memory-in-process = ["dep:knudge-core"]

[dependencies]
katu-core.workspace = true
katu-policy.workspace = true
katu-tools.workspace = true
katu-providers.workspace = true
katu-tui.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
knudge-core = { path = "../knudge/crates/knudge-core", optional = true }

# Único ponto `unsafe` do projeto (ADR 0016, E07-T04): matar o **grupo** de processos de um comando
# no timeout (`kill(-pgid)`), para que netos não sobrevivam. `std` não expõe wrapper seguro.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
