[package]
name = "katu-providers"
description = "E12 — camada de providers: built-in opencode go/zen + llama.cpp; demais via GDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
katu-core.workspace = true
katu-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Transporte bloqueante (sem runtime assíncrono; E01-T09). `rustls`, sem compressão de
# transporte: o hot path pede `Accept-Encoding: identity`.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# gzip opcional do corpo do pedido (só acima de um limiar; ver `UreqTransport`)
flate2.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
