# cargo-deny — políticas de supply chain (E14/E13).
#
# CI falha em advisory, licença fora da lista, wildcard ou fonte não confiável.
# Localmente: `cargo deny check` (alvo `make deny`).

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Deps internas de workspace (path, sem versão de registry) não são wildcards.
allow-wildcard-paths = true
deny = [
    # Sem servidor embutido (G7: só CLI + TUI; o katu não é um serviço).
    "axum",
    "warp",
    "actix-web",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
