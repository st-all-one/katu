# Teto de superfície do katu (E14-T05) — versionado.
#
# `xtask check-surface` conta a superfície real e compara com estes tetos: **avisa** quando uma
# dimensão atinge o teto e **falha** quando o excede. Subir um teto é uma decisão em PR (a lição do
# `arag` §20 / `maxima` §51.13): a superfície cresce de forma deliberada, nunca por acidente.
#
# Dimensões: crates do workspace, tools, regras de `policy/`, ADRs, eventos de diagnóstico,
# subcomandos do `xtask` (proxy dos gates) e artefactos crus de benchmark.

crates = 6
tools = 11
rules = 8
adrs = 27  # +1 ADR 0027 (fronteiras de transporte fechadas: SSE no provider, kernel in-process)
diag_events = 122  # +5 loop resilience (L-Q1 reconcile · L-Q6 turn_lock · L-Q2 stop · L-Q3 empty · L-Q4 echo)  # +1 agent.stall (L-P2)
xtask_commands = 32  # +1 `check-paths` (invariante §42: nada fora do projecto excepto a config global)
bench_artifacts = 30  # +1 `bench/e18/pos/` (leitura pós-optimização)  # +1 `bench/render/alloc.json` (E18-T10)  # +1 `bench/e18/taint/` (D1) · +1 `bench/e18/pool/` (E1) · +1 `bench/e18/conformal/` (C2)
